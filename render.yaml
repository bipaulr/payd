services:
  - type: web
    name: payd
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payd-db
          property: connectionString
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYOUT_SMOKE_EMAIL
        sync: false
      - key: DEMO_VENDOR_EMAIL_1
        sync: false
      - key: DEMO_VENDOR_EMAIL_2
        sync: false
      - key: DEMO_VENDOR_EMAIL_3
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VISION_MODEL
        sync: false
      - key: APP_URL
        sync: false
      - key: AG_GRID_LICENSE_KEY
        sync: false

databases:
  - name: payd-db
    plan: free
    databaseName: payd
    user: payd
